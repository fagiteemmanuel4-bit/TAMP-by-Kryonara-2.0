name: TAMP CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check browser JavaScript syntax
        run: |
          node --check 'api/[...slug].js'
          node --check public/site/auth.js
          node --check public/site/site.js
          node --check public/site/dashboard.js
          node --check public/site/protect.js
          node --check public/site/config.js
          node --check public/admin/admin.js
          node --check public/admin/bridge.js
      - name: Production API smoke check
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors https://tamp-wheat.vercel.app/api/health -o /tmp/tamp-health.json
          node -e "const h=require('/tmp/tamp-health.json'); console.log(JSON.stringify({ok:h.ok,storage:h.storage,authReady:h.authReady,emailConfigured:h.emailConfigured})); if(!h.ok) process.exit(1)"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check backend JavaScript syntax
        run: |
          node --check server.js
          node --check src/services/email.js
          node --check src/config/supabase.js
          node --check 'api/[...slug].js'
